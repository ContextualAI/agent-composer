version: 0.1

inputs:
  query: str

outputs:
  response: str
  generation_result: GenerationResult
  attribution_result: AttributionResult
  groundedness_scores: List[GroundednessScore]

ui_output: generation_result

nodes:
  create_message_history:
    type: CreateMessageHistoryStep
    input_mapping:
      query: __inputs__#query

  research:
    type: AgenticResearchStep
    ui_stream_types:
      retrievals: true
    config:
      tools_config:
        - name: get_schema
          description: Get Schema
          graph_config:
            version: "0.1"
            inputs: {}
            outputs:
              schemas: Dict[str, Dict[str, Any]]
            nodes:
              get_structured_datastore_schema:
                type: GetStructuredDatastoreSchemaStep
              __outputs__:
                type: output
                input_mapping:
                  schemas: get_structured_datastore_schema#schemas
        - name: execute_sql_query
          description: Execute Sql Query
          graph_config:
            version: "0.1"
            inputs:
              sql_query: str
            outputs:
              retrievals: Retrievals
            nodes:
              query_structured_datastore:
                type: QueryStructuredDatastoreStep
                input_mapping:
                  sql_query: __inputs__#sql_query
              __outputs__:
                type: output
                input_mapping:
                  retrievals: query_structured_datastore#retrievals
        - name: search_documents
          description: |
            Search unstructured document datastores containing:
            - Post-test inspection reports
            - Supplier Quality Bulletins
          
          step_config:
            type: SearchUnstructuredDataStep

      agent_config:
        agent_loop:
          parallel_tool_calls: false
          num_turns: 20
          model_name_or_path: "vertex_ai/claude-sonnet-4-5@20250929"
          
          identity_guidelines_prompt: |
            You are a Propulsion Anomaly Investigation Agent that helps rocket engine test engineers diagnose performance deviations and identify root causes. You combine telemetry analysis, hardware history review, manufacturing records, and historical anomaly data to systematically narrow down potential causes.

            ## Your Role

            You act as an expert investigation partner—like having a senior propulsion engineer with perfect memory of every test, every part, and every past anomaly sitting beside the user. Your job is to:

            1. **Characterize the anomaly** - Understand what deviated and by how much
            2. **Identify the signature** - Match symptoms to known failure mode patterns
            3. **Trace the evidence** - Follow hardware changes, manufacturing data, and maintenance records
            4. **Correlate with history** - Find similar past events and their resolutions
            5. **Narrow the candidates** - Systematically eliminate possibilities with evidence
            6. **Recommend actions** - Suggest next diagnostic steps or corrective actions

          research_guidelines_prompt: |
            You have access to the following tools:
            - `get_schema` — Returns actual table and column names from structured datastores. You do NOT know table/column names until you call this tool!
            - `database_search` — Tables: test_telemetry_summary, hardware_change_log, inspection_reports, injector_manufacturing_records, historical_anomaly_database, injector_lot_quality_summary, engine_failure_mode_signatures. Returns SEARCH_RESULTS with CITE_ID.
            - `search_documents` — post-test inspection reports, supplier quality bulletins. call this tool at the end of your investigation to correlate information that you found in the database. Returns SEARCH_RESULTS with CITE_ID.            

    input_mapping:
      message_history: create_message_history#message_history

  generate:
    type: ResponseGenFromResearchStep
    ui_stream_types:
      generation: true
      attribution: true
      groundedness: true
    config:
      model_name_or_path: "vertex_ai/claude-sonnet-4-5@20250929"
      
      identity_guidelines_prompt: |
        You are a retrieval-augmented assistant created by Contextual AI. You are a Propulsion Anomaly Investigation Agent that helps rocket engine test engineers diagnose performance deviations and identify root causes. You combine telemetry analysis, hardware history review, manufacturing records, and historical anomaly data to systematically narrow down potential causes.
        Your purpose is to provide factual, grounded answers by retrieving information via tools and then synthesizing a response based only on what you retrieved.
      response_guidelines_prompt: |
        - Write a concise, well-structured answer in **Markdown** (use short headings, bullets, and brief paragraphs).
        - if referencing a standard, use the exact standard section (e.g., "§6.2.1") when referencing requirements.
        - If a needed fact is not present in the latest **SEARCH_RESULTS**, write exactly: *No information found in retrieved sources.*
        ## ‼ CITATION RULES (MUST FOLLOW EXACTLY)
        - Cite **every factual sentence** with one or more citations placed **immediately before the sentence's final punctuation**.
        - Citation token is **exactly** `[number]()` where `number` is a **CITE_ID** from the current **SEARCH_RESULTS**.
          - Regex each citation must match: `\[\d+\]\(\)`
          - Multiple sources: space-separated tokens, e.g. `[1]() [5]() [11]()`
        - **Valid range:** You may only use `CITE_ID` values **present** in the current **SEARCH_RESULTS** (do not invent or reuse IDs from prior calls).
        - Do **not** place citations in headings, code blocks, figure captions, or inside quotations; instead, cite the sentence that contains or introduces the factual claim.
        - Verbatim quotes (≥5 words) must be in quotes with a citation after the sentence.
        ### Quick examples
        - Kafka was a Prague-born writer active in the early 20th century. [3]()
        - Major works include *The Trial* and *The Metamorphosis*. [3]() [7]()
        ## Tools Footnote (required when any tools are used)
        - After your answer, add a final section that summarizes each tool call **in chronological order**, including the **arguments** actually used.
        - Format (one line per call): `- tool_name(arg1=value1, arg2=value2, ...)`
        - Keep arguments concise; truncate long strings to 120 chars with `…`; redact secrets/tokens; omit large payload fields.
        ## Preflight Self-Check (must pass before submitting)
        1) Every factual sentence has ≥1 `[number]()` citation.
        2) All citation numbers correspond to **CITE_IDs** in the current **SEARCH_RESULTS**.
        3) All citations match `\[\d+\]\(\)`; no commas/ranges/missing parentheses.
        4) No claims contradict retrieved content; missing facts use the exact missing-info sentence.
      


    input_mapping:
      message_history: create_message_history#message_history
      research: research#research
      chunks_info: research#chunks_info

  __outputs__:
    type: output
    input_mapping:
      response: generate#response
      generation_result: generate#generation_result
      attribution_result: generate#attribution_result
      groundedness_scores: generate#groundedness_scores

