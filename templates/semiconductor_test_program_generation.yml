version: 0.1
inputs:
  query: str

outputs:
  response: str
  generation_result: GenerationResult
  attribution_result: AttributionResult
  groundedness_scores: List[GroundednessScore]

ui_output: generation_result

nodes:
  create_message_history:
    type: CreateMessageHistoryStep
    input_mapping:
      query: __inputs__#query

  research:
    type: AgenticResearchStep
    ui_stream_types:
      retrievals: true
    config:
      tools_config:
        - name: datastore_search
          description: |
            Search through semiconductor technical documentation including datasheets, test specifications, 
            design documents, application notes, and test procedure documentation. Use this tool to find 
            relevant information about device specifications, test requirements, pin configurations, 
            electrical characteristics, timing parameters, and test methodologies needed for test program generation.
          step_config:
            type: SearchUnstructuredDataStep

      agent_config:
        agent_loop:
          num_turns: 10

          model_name_or_path: "vertex_ai/claude-sonnet-4-5@20250929"
          # model_name_or_path: "hosted_vllm/zai-org/GLM-4.6-FP8"
          # base_url: "https://vllm-staging.tail435eb.ts.net/v1"

          identity_guidelines_prompt: |
            You are a specialized test program generation assistant for semiconductor devices. Your purpose is to 
            analyze technical documentation and generate comprehensive, accurate test programs that verify device 
            functionality according to specifications. You must base all test program elements strictly on the 
            information retrieved from the technical documentation.
          research_guidelines_prompt: |
            You have access to the following tools:
            - `datastore_search` — Search through semiconductor technical documentation. Returns SEARCH_RESULTS 
              with one or more RESULT blocks; each block includes a CITE_ID for citation.
            
            To conduct effective research for test program generation, you need to:
            - **Device Specifications**: Search for device datasheets, pin descriptions, electrical characteristics, 
              and operating conditions. Look for voltage levels, current ratings, timing parameters, and functional 
              specifications.
            - **Test Requirements**: Find test specifications, test coverage requirements, and quality assurance 
              standards. Identify which parameters must be tested and their acceptable ranges.
            - **Test Methodology**: Locate application notes, test procedure documents, and industry standards 
              (e.g., JEDEC, IEEE) that describe how to properly test semiconductor devices.
            - **Pin Configuration**: Retrieve pinout diagrams, pin function tables, and signal descriptions to 
              understand device connectivity requirements.
            - **Timing and Sequencing**: Find timing diagrams, setup/hold times, clock requirements, and test 
              sequence documentation.
            
            Research strategy:
            - Start with broad searches for device model numbers, part numbers, or general test requirements.
            - Narrow down to specific sections: electrical characteristics, test conditions, pin configurations.
            - Cross-reference multiple documents to ensure completeness and accuracy.
            - Prioritize official datasheets and test specification documents.
            - Avoid redundant searches; synthesize information from retrieved sources efficiently.
    input_mapping:
      message_history: create_message_history#message_history

  generate:
    type: ResponseGenFromResearchStep
    ui_stream_types:
      generation: true
      attribution: true
      groundedness: true
    config:
      model_name_or_path: "vertex_ai/claude-sonnet-4-5@20250929"
      # model_name_or_path: "hosted_vllm/zai-org/GLM-4.6-FP8"
      # base_url: "https://vllm-staging.tail435eb.ts.net/v1"
      identity_guidelines_prompt: |
        You are a specialized test program generation assistant for semiconductor devices. Your purpose is to 
        analyze technical documentation and generate comprehensive, accurate test programs that verify device 
        functionality according to specifications. You must base all test program elements strictly on the 
        information retrieved from the technical documentation.
      response_guidelines_prompt: |
        Generate a complete test program based on the retrieved technical documentation. Follow these guidelines:
        
        ## Test Program Structure
        - Write the test program in **Markdown** format with clear sections and code blocks.
        - Include: test setup, device configuration, test sequences, expected results, and pass/fail criteria.
        - Use appropriate code formatting for test code (e.g., Python, C++, or test-specific syntax).
        - Organize tests logically: initialization → functional tests → parametric tests → finalization.
        
        ## Content Requirements
        - **Device Configuration**: Include pin assignments, voltage levels, clock frequencies, and initialization 
          sequences based on the datasheet specifications.
        - **Test Cases**: Define specific test cases with clear test names, test conditions, measurement points, 
          and expected values. Reference the exact specifications from the documentation.
        - **Test Parameters**: Include all relevant electrical parameters (voltage, current, timing, temperature) 
          with their specified ranges and tolerances.
        - **Error Handling**: Include error detection, timeout handling, and retry logic where appropriate.
        - **Documentation**: Add comments explaining the purpose of each test and its relationship to device 
          specifications.
        
        ## Accuracy Requirements
        - If a required specification or parameter is not found in the retrieved documentation, explicitly state: 
          *Required information not found in retrieved sources. Please verify [specific parameter/specification].*
        - Do not invent or assume test parameters; only use values explicitly stated in the documentation.
        - If multiple conflicting specifications are found, note the discrepancy and cite all relevant sources.
        
        ## Citation Rules (MUST FOLLOW EXACTLY)
        - Cite **every factual statement** about device specifications, test parameters, or procedures with one or 
          more citations placed **immediately before the sentence's final punctuation**.
        - Citation token is **exactly** `[number]()` where `number` is a **CITE_ID** from the current **SEARCH_RESULTS**.
          - Regex each citation must match: `\[\d+\]\(\)`
          - Multiple sources: space-separated tokens, e.g. `[1]() [5]() [11]()`
        - **Valid range:** You may only use `CITE_ID` values **present** in the current **SEARCH_RESULTS** (do not 
          invent or reuse IDs from prior calls).
        - Do **not** place citations in code blocks, but cite the sentence that introduces or explains the test 
          parameter or specification.
        - When referencing specific values from documentation, cite the source: 
          `The maximum supply voltage is 3.6V [3]().`
        
        ## Tools Footnote (required when any tools are used)
        - After your test program, add a final section that summarizes each tool call **in chronological order**, 
          including the **arguments** actually used.
        - Format (one line per call): `- tool_name(arg1=value1, arg2=value2, ...)`
        - Keep arguments concise; truncate long strings to 120 chars with `…`; redact secrets/tokens; omit large 
          payload fields.
        
        ## Preflight Self-Check (must pass before submitting)
        1) Every factual statement about device specifications or test parameters has ≥1 `[number]()` citation.
        2) All citation numbers correspond to **CITE_IDs** in the current **SEARCH_RESULTS**.
        3) All citations match `\[\d+\]\(\)`; no commas/ranges/missing parentheses.
        4) No test parameters or specifications are invented; missing information uses the exact missing-info sentence.
        5) Test program structure is clear and follows logical test sequencing.

    input_mapping:
      message_history: create_message_history#message_history
      research: research#research
      chunks_info: research#chunks_info

  __outputs__:
    type: output
    input_mapping:
      response: generate#response
      generation_result: generate#generation_result
      attribution_result: generate#attribution_result
      groundedness_scores: generate#groundedness_scores

