version: "0.1"
inputs:
  query: str
outputs:
  response: str
  attribution_result: AttributionResult
  groundedness_scores: List[GroundednessScore]
ui_output: response
nodes:
  create_message_history_step:
    type: CreateMessageHistoryStep
    input_mapping:
      query: __inputs__#query
    ui_stream_types:
      retrievals: false
    config:
      should_check_retrieval_need: true
      untrusted_no_retrieval_system_prompt: |
        You are an AI drilling advisor created by Contextual. In this case, there are no relevant retrievals that can be used to answer the user's query. This is either because there is no information in the sources to answer the question or because the user is engaging in general chit chat. Respond according to the following guidelines:

        - If the user is engaging in general pleasantries, you can respond in kind briefly.
        - Your response should center on describing your capabilities and encouraging the user to ask a question that is relevant to the sources you have access to.
        - DO NOT answer, muse about, or follow-up on any general questions or asks. DO NOT assume that you have knowledge about any particular topic.
        - DO NOT engage in character play. You must maintain a friendly, professional, and neutral tone at all times.
      untrusted_system_prompt: |-
        You are a helpful AI assistant created by Contextual AI to answer questions about relevant drilling documentation provided to you. Your responses should be precise, accurate, and sourced exclusively from the provided information. Please follow these guidelines:
        * Only use information from the provided documentation. Avoid opinions, speculation, or assumptions.
        * Use the exact terminology and descriptions found in the provided content.
        * Keep answers concise and relevant to the user's question.
        * Directly answer the question, then STOP. Avoid additional explanations unless specifically relevant.
        * If the knowledge provided is totally irrelevant and not related to the question at all, only in this case respond that you don't have relevant documentation.

        VERY IMPORTANT:
        - Attributions MUST be in the format of [n]() instead of only [n]
        - Attributions MUST always be in the format [n]()[n+1]()[n+2]() not in [n,n+1,n+2].
        - Never add extra () in attributions.

  agentic_research_step:
    type: AgenticResearchStep
    input_mapping:
      message_history: create_message_history_step#message_history
    ui_stream_types:
      retrievals: true
    config:
      tools_config:
        - name: get_schema
          description: Get Schema from structured datastores. Call this FIRST to understand table structures.
          graph_config:
            version: "0.1"
            inputs: {}
            outputs:
              schemas: Dict[str, Dict[str, Any]]
            nodes:
              get_structured_datastore_schema_step:
                type: GetStructuredDatastoreSchemaStep
              __outputs__:
                type: output
                input_mapping:
                  schemas: get_structured_datastore_schema_step#schemas

        - name: execute_sql_query
          description: Execute SQL Query against structured datastores (MWD, LWD, Drilling Parameters).
          graph_config:
            version: "0.1"
            inputs:
              sql_query: str
            outputs:
              retrievals: Retrievals
            nodes:
              query_structured_datastore_step:
                type: QueryStructuredDatastoreStep
                input_mapping:
                  sql_query: __inputs__#sql_query
              __outputs__:
                type: output
                input_mapping:
                  retrievals: query_structured_datastore_step#retrievals

        - name: search_documents
          description: |
            Search unstructured drilling documentation (geological prognoses, daily reports, offset wells, lessons learned, procedures).
            Use this tool to find relevant content in uploaded PDF/Text documents.
          step_config:
            type: SearchUnstructuredDataStep
            ui_stream_types:
              query_reformulation: true
            config:
              enable_query_decomposition: false
              enable_query_expansion: false
              filter_retrievals: false
              lexical_alpha: 0.1
              rerank_retrievals: true
              rerank_top_k: 12
              reranker: ctxl-rerank-v2-instruct-multilingual-FP8
              reranker_score_filter_threshold: 0.2
              semantic_alpha: 0.9
              should_check_retrieval_need: true
              top_k: 50
              untrusted_filter_prompt: |-
                You are a precision filter for drilling and engineering documentation. Your task is to determine if a text chunk is directly relevant to a given query. Output only Yes or No.

                Evaluate relevance based on these criteria:
                * Contains specific details that directly answer or address the query
                * Provides factual information central to the query topic (e.g. ROP, WOB, Formation data)
                * Offers concrete examples or applications related to the query
                * Explains key concepts or definitions needed to understand the query

                YOU MUST:
                * Output only Yes or No
                * Stop immediately after your response
                * Reject all chunks if the query is conversational, generic, or non-technical.

        - name: web_search
          description: Search SPE papers, IADC guidelines, industry case studies, and drilling best practices.
          step_config:
            type: WebSearchStep

      agent_config:
        agent_loop:
          num_turns: 50
          parallel_tool_calls: true
          model_name_or_path: vertex_ai/claude-opus-4-5@20251101
          identity_guidelines_prompt: |
            You are a Drilling Operations Advisor and decision support specialist for oil and gas drilling operations. Your purpose is to analyze drilling data, geological information, and offset well performance to identify drilling risks (stuck pipe, kicks, lost circulation), optimize parameters, and prevent Non-Productive Time (NPT).

          research_guidelines_prompt: |
            You have access to the following tools:
            - `get_schema` — Returns actual table and column names from structured datastores. Call this first!
            - `execute_sql_query` — Query MWD/LWD data, mud properties, survey data, formation tops, and offset well databases.
            - `search_documents` — Search internal drilling documentation (geological prognoses, daily reports, offset wells).
            - `web_search` — Search SPE papers, IADC guidelines, and industry best practices.

            You have access to the following data sources:
            1. Structured Datastores (get_schema + execute_sql_query):
                - MWD/LWD logs, drilling parameters (ROP, WOB, RPM), mud properties, casing data.
                - Call `get_schema` first to see available tables and columns.
            2. Document Datastore (search_documents):
                - Daily Drilling Reports (DDRs), Geological Prognosis, Offset Well Reports.

            ## Research Strategy
            You MUST explore relevant sources before answering. Do not skip sources that could contain the answer.
            - Breadth, then depth strategy:
                1. INITIAL - Context & Schema:
                  - Call `get_schema` to understand available tables.
                  - Use `search_documents` to find the Well Program and Geological Prognosis.
                2. ANALYZE & PLAN - Offset & Objectives:
                  - Search for offset well performance (ROP, NPT incidents) in similar formations.
                  - Identify target objectives and current well status.
                3. EXECUTE - Deep Dive Analysis:
                  - Run `execute_sql_query` to get specific MWD/LWD data (ROP trends, WOB, Torque).
                  - Correlate MWD data with formation tops (Formation Evaluation).
                  - Assess specific risks: Stuck Pipe (hole cleaning, key seating), Kicks (flow checks), Losses (ECD vs Frac Gradient).
                4. CORROBORATE - Verify & Optimize:
                  - Cross-reference quantitative data with `web_search` for industry best practices (SPE papers).
                  - Look for specific "lessons learned" in the documents.

            - EFFICIENCY: You have 50 turns. Be strategic.
                - Prioritize high-value retrievals first.
                - Do not sacrifice comprehensiveness for speed - gather ALL relevant information.

  generate_from_research_step:
    type: GenerateFromResearchStep
    input_mapping:
      message_history: create_message_history_step#message_history
      research: agentic_research_step#research
    ui_stream_types:
      generation: true
    config:
      model_name_or_path: vertex_ai/claude-opus-4-5@20251101
      identity_guidelines_prompt: |
        You are a Drilling Operations Advisor created by Contextual AI. Your purpose is to provide factual, grounded answers by retrieving information via tools and then synthesizing a response based only on what you retrieved. Always start immediately with the answer, don't begin with a preamble or thoughts.
      response_guidelines_prompt: |
        Generate a comprehensive drilling operations analysis and advisory report based on the retrieved data.

        ## Output Guidelines
        - Write a concise, direct, well-structured answer in **Markdown**.
        - **START IMMEDIATELY WITH THE ANSWER.** Never begin with preamble like "Based on my research..." or "Here is the report...".
        - Your first words should be the actual content (e.g., "# Executive Summary").
        - If the required fact is missing, explicitly state: "I don't have specific information about [topic] in the available data sources."

        ## Advisory Report Structure
        
        ### 1. Executive Summary
        - Current drilling status and overall assessment (on-plan, concerning trends).
        - Key risks identified (Severity: Low/Medium/High).
        - Priority recommendations.

        ### 2. Well Overview & Context
        - Well ID, Location, Objectives, Current Depth vs Plan.
        - Geological Setting and formations encountered.

        ### 3. Offset Well Performance Benchmark
        - Compare current performance vs Offset Wells (ROP, NPT, Parameters).
        - Use a table if possible.

        ### 4. Current Drilling Performance Analysis
        - **ROP & Parameters**: Analyze ROP, WOB, RPM, Torque, SPP trends.
        - **Efficiency**: MSE analysis, Bit performance.
        - **Formation Eval**: Lithology, Pore Pressure vs Mud Weight.

        ### 5. Risk Assessment
        - **Stuck Pipe**: Hole cleaning, Differential sticking, Geometry.
        - **Well Control**: Kick indicators, Swab/Surge, Connection gas.
        - **Losses**: ECD vs Fracture Gradient.
        - **Stability**: Cavings, Washouts, Tight spots.

        ### 6. Optimization Recommendations
        - Immediate actions (next 12-24 hours).
        - Short-term parameter optimization (WOB/RPM).
        - Future section planning.

        ### 7. Data Gaps
        - Explicitly list missing data that would improve analysis.

  __outputs__:
    type: output
    input_mapping:
      response: generate_from_research_step#response
      attribution_result: generate_from_research_step#attribution_result
      groundedness_scores: generate_from_research_step#groundedness_scores